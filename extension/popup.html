<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCMix Pro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h1 { font-size: 18px; margin: 0 0 4px; color: #f5a623; }
    h2 { font-size: 14px; margin: 16px 0 8px; color: #bbb; }
    p { margin: 4px 0; font-size: 13px; }
    label { font-size: 12px; display: block; margin: 6px 0 2px; color: #aaa; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 6px 8px;
      background: #16213e;
      border: 1px solid #333;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 13px;
    }
    input:focus { border-color: #f5a623; outline: none; }
    button {
      background: #f5a623;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      margin-right: 6px;
      margin-top: 4px;
    }
    button:hover { background: #ffb84d; }
    button:disabled { opacity: 0.5; cursor: default; }
    button.danger { background: #c0392b; color: #fff; }
    button.danger:hover { background: #e74c3c; }
    button.secondary { background: #2d4059; color: #e0e0e0; }
    button.secondary:hover { background: #3b5577; }
    ul { font-size: 12px; padding-left: 18px; line-height: 1.6; }
    #status { font-style: italic; color: #aaa; margin-top: 10px; font-size: 12px; min-height: 18px; }
    .section { border-top: 1px solid #2a2a4a; margin-top: 12px; padding-top: 12px; }
    .user-info { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #2d4059; }
    .hidden { display: none; }
    .flex { display: flex; gap: 6px; align-items: center; }
    .credentials-hint { font-size: 11px; color: #888; margin: 4px 0; }
    a { color: #f5a623; }
  </style>
</head>
<body>
  <h1>SCMix Pro</h1>

  <div id="auth-section" class="section">
    <div id="signed-out-view">
      <p>Sign in to SoundCloud to access your likes, playlists, and tracks.</p>

      <div id="cred-setup">
        <label for="client-id">Client ID</label>
        <input type="text" id="client-id" placeholder="Paste your SoundCloud client_id">

        <label for="client-secret">Client Secret</label>
        <input type="password" id="client-secret" placeholder="Paste your SoundCloud client_secret">

        <div class="flex">
          <button id="save-creds">Save Credentials</button>
        </div>
        <p class="credentials-hint">
          Get these from <a href="https://soundcloud.com/you/apps" target="_blank">soundcloud.com/you/apps</a>
          (Artist Pro account required).
        </p>
      </div>

      <div id="ready-to-signin" class="hidden">
        <button id="sign-in">Sign in with SoundCloud</button>
      </div>
    </div>

    <div id="signed-in-view" class="hidden">
      <div class="user-info">
        <img id="user-avatar" class="avatar" src="" alt="">
        <div>
          <strong id="user-name"></strong><br>
          <span id="user-username" style="font-size:12px;color:#888;"></span>
        </div>
      </div>
      <div class="flex">
        <button id="sign-out" class="danger">Sign Out</button>
      </div>
    </div>
  </div>

  <div class="section">
    <p id="status">Mixing engine ready.</p>
    <div class="flex">
      <button id="automix">Auto Mix</button>
      <button id="stop" class="danger">Stop</button>
    </div>
  </div>

  <div class="section">
    <h2>Zoom Musician Audio</h2>
    <p>Route SCMix Pro into Zoom with Original Sound for Musicians enabled.</p>
    <div class="flex">
      <button id="share-browser-audio">Share Browser Audio</button>
      <button id="stop-browser-audio" class="danger">Stop Audio</button>
    </div>
    <ul id="zoom-checklist"></ul>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
